[workspace]
members = [
    "oc-nano-core",
    "oc-nano-history",
    "oc-nano-schema",
    "oc-nano-state",
    "oc-nano-prompt",
    "oc-nano-compaction",
    "oc-nano-instructions",
    "oc-nano-napi",
]

resolver = "2"

[profile.release]
opt-level = 3
codegen-units = 1
# MUST stay "unwind": the napi layer wraps every binding in catch_unwind so a
# Rust panic becomes a catchable JS Error instead of aborting the host process.
panic = "unwind"
lto = true
